<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friendspot - Coming Soon</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .container { max-width: 500px; padding: 2rem; background: #1e293b; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 0.5rem; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.5; margin-bottom: 2rem; }
        form { display: flex; flex-direction: column; gap: 1rem; }
        input[type="email"] { padding: 0.75rem 1rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
        button { background: #0284c7; color: white; font-weight: bold; border: none; padding: 0.75rem; border-radius: 6px; font-size: 1rem; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0369a1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Friendspot</h1>
        <p>A safer, secure, and private social space built to connect friends, protect personal data, and reject tracking algorithms.</p>
        <form action="https://formspree.io" method="POST">
            <input type="email" name="email" placeholder="Enter your email address" required>
            <button type="submit">Join the Priority Waitlist</button>
        </form>
    </div>
</body>
</html>
